plugins {
    id 'com.android.application'
}

// Cada compilación en GitHub sube el número de versión (así Android deja actualizar encima)
def numero = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
def claveFirma = System.getenv('KEYSTORE_FILE')

android {
    namespace 'es.sandra.casamovil'
    compileSdk 34

    defaultConfig {
        applicationId 'es.sandra.casamovil'
        minSdk 21
        targetSdk 34
        versionCode numero
        versionName '2.0.' + numero
    }

    signingConfigs {
        release {
            if (claveFirma) {
                storeFile file(claveFirma)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS') ?: 'casa'
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sin la clave guardada en GitHub se firma con una temporal
            signingConfig claveFirma ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
