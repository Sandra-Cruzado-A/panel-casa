# Compila las dos apps (tablet y móvil) y las publica en «Releases».
# Se ejecuta al cambiar algo dentro de android/ o a mano desde la pestaña Actions → «Compilar apps» → Run workflow.
name: Compilar apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apps.yml'

permissions:
  contents: write

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Copia de la web dentro de las apps (por si arrancan sin internet)
        run: |
          mkdir -p android/tablet/src/main/assets android/movil/src/main/assets
          cp index.html android/tablet/src/main/assets/index.html
          cp movil.html android/movil/src/main/assets/movil.html
          cp -r fuentes android/tablet/src/main/assets/fuentes
          cp -r fuentes android/movil/src/main/assets/fuentes

      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/casa.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/casa.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No está el secreto KEYSTORE_BASE64: se firma con una clave temporal y para actualizar habrá que desinstalar antes."
          fi

      - name: Compilar
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: casa
        run: gradle -p android assembleRelease --no-daemon --stacktrace

      - name: Preparar los APK
        run: |
          cp android/tablet/build/outputs/apk/release/tablet-release.apk panel-casa-tablet.apk
          cp android/movil/build/outputs/apk/release/movil-release.apk casa-movil.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apps-${{ github.run_number }}
          name: Apps · versión ${{ github.run_number }}
          body: |
            - **panel-casa-tablet.apk** → para la tablet
            - **casa-movil.apk** → para los móviles Android de la familia
          files: |
            panel-casa-tablet.apk
            casa-movil.apk
          make_latest: true
